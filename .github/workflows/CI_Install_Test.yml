name: CI - Feature Branch

on:
  push:
    branches:
      - "feature-1"

jobs:
  test-and-pr:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: config.settings.test
      PYTHONUNBUFFERED: 1

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python (Django)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Setup Node (Next.js)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4️⃣ Install backend dependencies
      - name: Install Django dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5️⃣ Run Django tests
      - name: Run Django tests
        run: |
          cd backend
          python manage.py migrate
          python manage.py test

      # 6️⃣ Install frontend dependencies
      - name: Install Next.js dependencies
        run: |
          cd frontend
          npm ci

      # 7️⃣ Run Next.js tests (if present)
      - name: Run Next.js tests
        run: |
          cd frontend
          npm run test --if-present

      # 8️⃣ Validate Dockerfiles
      - name: Build backend Docker image
        run: docker build -t django-test ./backend

      - name: Build frontend Docker image
        run: docker build -t nextjs-test ./frontend

      # 9️⃣ Create PR to dev (only if everything passed)
      - name: Create Pull Request to dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head "${{ github.ref_name }}" \
            --title "Merge ${{ github.ref_name }} into dev" \
            --body "✅ CI passed (Django + Next.js). Ready for review."
