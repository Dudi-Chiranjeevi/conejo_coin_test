name: CI - Backend Build + Frontend Build

on:
  push:
    branches:
      - feature-*

jobs:
  ci:
    name: Run Backend + Frontend CI
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      # -----------------------------
      # Backend - Django Build Only
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django Build Check
        working-directory: backend
        run: |
          python manage.py collectstatic --noinput || true

      # -----------------------------
      # Frontend - Next.js Build
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: collectibles-inventory
        run: npm ci

      - name: Build Frontend app
        working-directory: collectibles-inventory
        run: npm run build

      # -----------------------------
      # Create PR to dev
      # -----------------------------
      - name: Create Pull Request to Dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head ${GITHUB_REF_NAME} \
            --title "Auto PR: ${GITHUB_REF_NAME} → dev" \
            --body "CI passed successfully. Ready to merge into dev."
