name: CD - Deploy to Cloud Run

on:
  pull_request:
    branches:
      - dev
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      # -----------------------
      # Build & Push Backend
      # -----------------------
      - name: Build Backend
        run: |
          docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/conejo-backend:${IMAGE_TAG} ./backend
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/conejo-backend:${IMAGE_TAG}

      - name: Deploy Backend
        run: |
          gcloud run deploy conejo-backend \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/conejo-backend:${IMAGE_TAG} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --quiet

      # -----------------------
      # Build & Push Frontend
      # -----------------------
      - name: Build Frontend
        run: |
          docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/conejo-frontend:${IMAGE_TAG} ./collectibles-inventory
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/conejo-frontend:${IMAGE_TAG}

      - name: Deploy Frontend
        run: |
          gcloud run deploy conejo-frontend \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/conejo-frontend:${IMAGE_TAG} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --quiet
